<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年末調整PDF転記</title><style>body{font-family:system-ui;margin:0;background:#f2f6f8;color:#183746}header{background:#12445d;color:white;padding:20px}main{max-width:900px;margin:auto;padding:15px}section{background:white;padding:18px;border-radius:12px;margin:12px 0}button,input,select{font:inherit;padding:9px;margin:5px}button{background:#116987;color:white;border:0;border-radius:7px}canvas{display:block}#area{position:relative;width:max-content}#marks{position:absolute;inset:0;cursor:crosshair}.mark{position:absolute;background:#d6f6ffb9;border:1px solid #0886a3;pointer-events:none;font-size:12px}#viewer{overflow:auto;background:#dde9ee;max-height:70vh}.note{background:#fff0d6;padding:12px}</style></head><body><header><h2>年末調整PDF転記アプリ（試作版）</h2>XMLを読み込み、病院の申告書PDFへ転記</header><main><section class="note">これは試作版です。e-Tax固有XMLの自動項目照合・住宅ローン控除の計算・ZIP読み込みは未対応です。印刷後に全項目を必ず確認してください。個人番号を入力しないでください。</section><section><h3>1. XMLファイル</h3><input id="xml" type="file" accept=".xml,text/xml"><p id="xmlmsg"></p><select id="field"><option value="">項目を選択</option></select></section><section><h3>2. 空欄のPDF</h3><input id="inputpdf" type="file" accept=".pdf,application/pdf"><p id="pdfmsg"></p></section><section><h3>3. PDFの入力位置をタップ</h3><label>固定文字（XML以外を入力する場合）<input id="literal" placeholder="空欄ならXML項目を使用"></label><label>文字サイズ<input id="font" type="number" value="10" min="6" max="20"></label><div><button id="previous">前へ</button><span id="pageNumber"></span><button id="following">次へ</button><button id="undo">最後を取消</button><button id="reset">すべて消去</button></div><div id="viewer"><div id="area"><canvas id="canvas"></canvas><div id="marks"></div></div></div><p id="mapped"></p></section><section><button id="export">記入済みPDFを保存</button><p id="message"></p></section><small>国税庁の公式アプリではありません。ファイル内容はこのブラウザ内で処理されます。GitHubに個人情報をコミットしないでください。</small></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
const $=x=>document.getElementById(x);let fields=[],bytes=null,pdf=null,page=1,marks=[],pdfName='form.pdf';
function extract(node,p){for(const c of node.children){const path=p+'/'+c.localName;if(c.children.length)extract(c,path);else{let value=(c.textContent||'').trim();if(value&&value.length<250&&!/個人番号|マイナンバー/i.test(path)&&!/^[0-9]{12}$/.test(value))fields.push({path,value})}}}
$('xml').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>8000000)throw Error('8MBを超えています');let text=await f.text();if(/<!DOCTYPE|<!ENTITY/i.test(text))throw Error('DOCTYPE/ENTITYは使用できません');let d=new DOMParser().parseFromString(text,'application/xml');if(d.querySelector('parsererror'))throw Error('XMLを解析できません');fields=[];extract(d.documentElement,'/'+d.documentElement.localName);$('field').replaceChildren(new Option('項目を選択',''));fields.forEach((x,i)=>$('field').add(new Option(x.path+' : '+x.value.slice(0,20),String(i))));$('xmlmsg').textContent=fields.length+'項目を抽出しました（公式項目との対応は未検証）'}catch(err){$('xmlmsg').textContent=err.message}};
$('inputpdf').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>15000000)throw Error('15MBを超えています');bytes=new Uint8Array(await f.arrayBuffer());pdfName=f.name;pdf=await pdfjs.getDocument({data:bytes.slice()}).promise;page=1;marks=[];await draw();$('pdfmsg').textContent=f.name+'（'+pdf.numPages+'ページ）'}catch(err){$('pdfmsg').textContent=err.message}};
async function draw(){if(!pdf)return;const p=await pdf.getPage(page),v=p.getViewport({scale:1.5}),canvas=$('canvas');canvas.width=Math.ceil(v.width);canvas.height=Math.ceil(v.height);await p.render({canvasContext:canvas.getContext('2d'),viewport:v}).promise;$('area').style.width=canvas.width+'px';$('area').style.height=canvas.height+'px';$('pageNumber').textContent=page+' / '+pdf.numPages;renderMarks()}
function renderMarks(){$('marks').replaceChildren();for(const m of marks.filter(x=>x.page===page)){let el=document.createElement('div');el.className='mark';el.style.left=m.x*100+'%';el.style.top=m.y*100+'%';el.textContent=m.text||fields[m.idx]?.value||'';$('marks').append(el)}$('mapped').textContent='配置済み '+marks.length+'件'}
$('marks').onclick=e=>{if(!pdf)return;let idx=$('field').value,text=$('literal').value;if(idx===''&&!text){$('mapped').textContent='XML項目または固定文字を指定してください';return}let r=e.currentTarget.getBoundingClientRect();marks.push({page,x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),idx:idx===''?-1:Number(idx),text,size:Number($('font').value)||10});renderMarks()};
$('previous').onclick=async()=>{if(pdf&&page>1){page--;await draw()}};$('following').onclick=async()=>{if(pdf&&page<pdf.numPages){page++;await draw()}};$('undo').onclick=()=>{marks.pop();renderMarks()};$('reset').onclick=()=>{if(confirm('配置を消去しますか？')){marks=[];renderMarks()}};
$('export').onclick=async()=>{try{if(!bytes||!marks.length)throw Error('PDFと配置を指定してください');const out=await PDFLib.PDFDocument.load(bytes);for(const m of marks){let t=m.text||fields[m.idx]?.value||'';if(!t||/個人番号|マイナンバー/i.test(fields[m.idx]?.path||'')||/^[0-9]{12}$/.test(t))continue;const p=out.getPage(m.page-1),{width,height}=p.getSize(),c=document.createElement('canvas'),ctx=c.getContext('2d'),size=Math.max(6,Math.min(20,m.size));ctx.font=size*3+'px sans-serif';c.width=Math.max(10,Math.ceil(ctx.measureText(t).width+10));c.height=size*4;let x=c.getContext('2d');x.font=size*3+'px sans-serif';x.fillStyle='#111';x.textBaseline='top';x.fillText(t,2,2);let png=await out.embedPng(await(await fetch(c.toDataURL('image/png'))).arrayBuffer());p.drawImage(png,{x:width*m.x,y:height*(1-m.y)-c.height/3,width:c.width/3,height:c.height/3})}const b=new Blob([await out.save()],{type:'application/pdf'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=pdfName.replace(/\.pdf$/i,'')+'-記入済.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('message').textContent='PDFを生成しました。内容・位置を確認してください'}catch(err){$('message').textContent='エラー: '+err.message}};</script></body></html>
